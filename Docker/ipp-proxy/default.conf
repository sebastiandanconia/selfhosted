
server {
	listen 631 ssl;
	listen	[::]:631 ssl;
	server_name	$hostname;

	# Substitute your own certificate name in place of $HOSTNAME
	ssl_certificate /etc/nginx/ssl/live/$HOSTNAME/fullchain.pem;
	ssl_certificate_key /etc/nginx/ssl/live/$HOSTNAME/privkey.pem;

	# This block may be repeated with variations as many times as desired
	# to support different users/groups.
	location / {
		# IPP URL of printer on the same network as this proxy
		proxy_pass http://hazlitt.lan:631/;

		# HTTP 1.1 is REQUIRED by the printer
		proxy_http_version 1.1;

		proxy_set_header Host $http_host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	# location /$SECRET_AUTH_KEY/ {
	#	proxy_pass http://some.printer.lan:631/;
	#	proxy_http_version 1.1;	
	#}

}
