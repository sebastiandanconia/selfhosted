version: '3'

services:
  # Database
  wp_db:
    image: mysql/mysql-server:8.0
    volumes:
      - wp_db_data:/var/lib/mysql
    restart: always
    env_file: .env
    environment:
      MYSQL_ROOT_PASSWORD: '${MYSQL_ROOT_PASSWORD}'
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: '${MYSQL_PASSWORD}'
    networks:
      - wpsite
# phpmyadmin - I wasn't able to get this to work on ARM
#  phpmyadmin:
#    depends_on:
#      - wp_db
#    image: phpmyadmin/phpmyadmin
#    image: arm64v8/phpmyadmin
#    restart: always
#    ports:
#      - '8080:80'
#    env_file: .env
#    environment:
#      PMA_HOST: wp_db
#      MYSQL_ROOT_PASSWORD: '${MYSQL_ROOT_PASSWORD}'
#    networks:
#      - wpsite
  # Wordpress
  wordpress:
    depends_on:
      - wp_db
    image: wordpress:latest
    ports:
      - 8000:80
    restart: always
    volumes:
     - wp_html:/var/www/html
    env_file: .env
    environment:
      WORDPRESS_DB_HOST: wp_db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: '${WORDPRESS_DB_PASSWORD}'
    networks:
      - wpsite
networks:
  wpsite:
volumes:
  wp_html:
  wp_db_data:
